services:
  postgres:
    image: postgres:16
    container_name: agentdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro

volumes:
  pgdata:
